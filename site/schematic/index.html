<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>북반구 대기 3D 모식도</title>
<meta name="description" content="일별 ERA5 자료로 구동하는 북반구 성층권·대류권·지상·해양 구조의 3D 동적 모식도">
<link rel="stylesheet" href="../assets/style.css">
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  body { overflow-x: hidden; }
  #stage { position: relative; width: 100%; height: min(72vh, 760px); min-height: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; font-size: .82rem; line-height: 1.45; font-variant-numeric: tabular-nums; max-width: calc(100% - 20px); pointer-events: none; }
  .hud .d { font-size: 1.05rem; font-weight: 700; }
  .hud .ev { color: var(--warm); font-weight: 600; }
  .lbl { position: absolute; transform: translate(-50%, -50%); font-size: 12px; font-weight: 700; pointer-events: none; text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface); white-space: nowrap; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  #slider { flex: 1 1 260px; accent-color: var(--accent); min-height: 32px; }
  .ticks { position: relative; height: 16px; margin: -6px 0 6px; }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; color: var(--ink-2); white-space: nowrap; }
  .ticks span::before { content: ""; display: block; width: 2px; height: 6px; margin: 0 auto 1px; background: currentColor; }
  .ticks span.ssw { color: var(--s4); } .ticks span.ural { color: var(--s2); } .ticks span.sel { color: var(--ink); }
  .layers label { margin-right: 10px; font-size: .88rem; white-space: nowrap; }
  .keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 14px; font-size: .84rem; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>북반구 대기 3D 모식도 <span class="small">— 일별 자료로 구동</span></h1>
  <a href="../"><button type="button">대시보드</button></a>
  <button type="button" id="themeBtn">테마: 시스템</button>
</div></header>
<main class="wrap">
  <div class="bar" style="margin-top:14px">
    <button type="button" id="playBtn" aria-label="재생">▶ 재생</button>
    <select id="speedSel" aria-label="속도"><option value="1">1일/초</option><option value="3" selected>3일/초</option><option value="6">6일/초</option></select>
    <select id="jumpSel" aria-label="건너뛰기 단위"><option value="1">1일</option><option value="5" selected>반순(5일)</option><option value="7">주(7일)</option><option value="30">월(30일)</option></select>
    <button type="button" id="backBtn" aria-label="뒤로">◀◀</button><button type="button" id="fwdBtn" aria-label="앞으로">▶▶</button>
    <span class="pill" id="rangeInfo"></span>
  </div>
  <input type="range" id="slider" min="0" max="0" value="0" aria-label="날짜" style="width:100%">
  <div class="ticks" id="ticks"></div>
  <div id="stage"><div class="hud" id="hud">자료 불러오는 중…</div></div>
  <div class="bar layers" role="group" aria-label="층 켜기·끄기">
    <label><input type="checkbox" data-l="strat" checked> 성층권 10 hPa</label>
    <label><input type="checkbox" data-l="jet" checked> 제트 250 hPa</label>
    <label><input type="checkbox" data-l="mid" checked> 500 hPa 편차·플럭스</label>
    <label><input type="checkbox" data-l="sfc" checked> 지상·해양</label>
    <label><input type="checkbox" data-l="col" checked> 극관 기둥</label>
    <button type="button" id="resetBtn">시점 초기화</button>
  </div>
  <div class="card keys" id="keys"></div>
  <p class="small" id="notes"></p>
</main>
<footer><div class="wrap">자료: ERA5(ECMWF/Copernicus, 최근 약 3개월은 잠정 ERA5T) · 해안선 Natural Earth · three.js r128(cdnjs). 높이와 화살표 길이는 보기 쉽게 과장했다. 모양은 그날 자료에서 계산한 값이며 손으로 그린 가정이 아니다.</div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../assets/viz.js"></script>
<script src="schematic.js"></script>
</body>
</html>
